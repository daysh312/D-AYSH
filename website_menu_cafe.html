<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Cafe</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #6b4f4f;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }

    .container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .menu-section {
      margin-bottom: 30px;
    }

    .menu-section h2 {
      border-bottom: 2px solid #6b4f4f;
      padding-bottom: 5px;
      color: #333;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #ccc;
    }

    .menu-item span {
      font-size: 16px;
    }

    .price {
      font-weight: bold;
      color: #6b4f4f;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #6b4f4f;
      color: white;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<header>
  ☕ Cafe Rasa Kita - Menu
</header>

<div class="container">

  <div class="menu-section">
    <h2>Minuman</h2>
    <div class="menu-item">
      <span>Espresso</span>
      <span class="price">Rp 15.000</span>
    </div>
    <div class="menu-item">
      <span>Cappuccino</span>
      <span class="price">Rp 25.000</span>
    </div>
    <div class="menu-item">
      <span>Latte</span>
      <span class="price">Rp 27.000</span>
    </div>
    <div class="menu-item">
      <span>Teh Tarik</span>
      <span class="price">Rp 18.000</span>
    </div>
  </div>

  <div class="menu-section">
    <h2>Makanan</h2>
    <div class="menu-item">
      <span>Nasi Goreng Spesial</span>
      <span class="price">Rp 30.000</span>
    </div>
    <div class="menu-item">
      <span>Mie Goreng</span>
      <span class="price">Rp 25.000</span>
    </div>
    <div class="menu-item">
      <span>Roti Bakar</span>
      <span class="price">Rp 20.000</span>
    </div>
  </div>

  <div class="menu-section">
    <h2>Snack</h2>
    <div class="menu-item">
      <span>Kentang Goreng</span>
      <span class="price">Rp 18.000</span>
    </div>
    <div class="menu-item">
      <span>Pisang Goreng</span>
      <span class="price">Rp 15.000</span>
    </div>
  </div>

</div>

<footer>
  © 2026 Cafe Rasa Kita
</footer>

</body>
</html>
